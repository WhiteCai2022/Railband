server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 62.234.140.204;
    location /.well-known/acme-challenge/ { root /var/www/railband-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 62.234.140.204;
    ssl_certificate /etc/letsencrypt/live/62.234.140.204/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/62.234.140.204/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128m;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 20s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
